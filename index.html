<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE JANARAL TRADE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f19;color:#f1f5f9;font-family:sans-serif}
.hidden{display:none!important}
.card{background:#131b2e;border:1px solid #1e293b;border-radius:12px;padding:18px;margin-bottom:16px}
.inp{background:#0b0f19;border:1px solid #334155;color:#fff;border-radius:8px;padding:10px;width:100%;margin-top:4px}
label{font-size:12px;color:#94a3b8;font-weight:700;display:block;margin-top:10px}
.btn{border:none;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;color:#fff;background:#1e293b}
.blue{background:#2563eb}.green{background:#059669}.red{background:#dc2626}
.nav{background:#131b2e;padding:12px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #1e293b}
.wrap{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:10px;border-bottom:1px solid #1e293b;text-align:left;white-space:nowrap}
.t-green{color:#10b981}.t-red{color:#ef4444}
.bg-win{background:rgba(16,185,129,0.14)}.bg-loss{background:rgba(239,68,68,0.14)}
</style>
</head>
<body>

<div id="auth-box" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="width:100%;max-width:400px;padding:28px">
    <h2 style="text-align:center;color:#3b82f6">THE JANARAL TRADE</h2>
    <div style="display:flex;gap:8px;margin:16px 0">
      <button type="button" id="m-login" class="btn blue" style="flex:1" onclick="setMode('login')">Login</button>
      <button type="button" id="m-signup" class="btn" style="flex:1" onclick="setMode('signup')">Create Account</button>
    </div>
    <label>Email</label><input type="email" id="email" class="inp" placeholder="trader@example.com">
    <label>Password (6+ chars)</label><input type="password" id="pass" class="inp" placeholder="******">
    <button type="button" id="auth-btn" class="btn blue" style="width:100%;margin-top:16px" onclick="doAuth()">Login to Dashboard</button>
    <div id="msg" style="color:#fbbf24;font-size:13px;margin-top:12px;text-align:center;background:#0b0f19;padding:8px;border-radius:6px;min-height:36px">Status: Ready</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="nav">
    <div><strong style="color:#3b82f6;font-size:18px">THE JANARAL TRADE</strong> <span id="u-mail" style="font-size:12px;color:#94a3b8"></span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" id="p-dash" class="btn blue" onclick="goPage('dash')">Dashboards</button>
      <button type="button" id="p-entry" class="btn" onclick="goPage('entry')">+ Trade Entry</button>
      <button type="button" class="btn green" onclick="dlExcel()">Excel</button>
      <button type="button" class="btn red" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="view-dash" class="wrap">
    <div style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto">
      <button type="button" id="t-ind" class="btn blue" onclick="setMkt('Indian Market')">Indian Market</button>
      <button type="button" id="t-btc" class="btn" onclick="setMkt('Bitcoin')">Bitcoin</button>
      <button type="button" id="t-gld" class="btn" onclick="setMkt('Gold')">Gold</button>
    </div>

    <div class="card" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px">
      <div style="display:flex;align-items:center;gap:8px">
        <span>Date:</span><input type="date" id="f-date" class="inp" style="width:auto;margin:0" onchange="render()">
        <button type="button" class="btn" onclick="document.getElementById('f-date').value='';render()">All</button>
      </div>
      <strong id="d-info" style="color:#60a5fa;font-size:13px"></strong>
    </div>

    <div class="grid">
      <div class="card"><small>Net P&L</small><h2 id="k-pnl">0</h2></div>
      <div class="card"><small>Total Trades</small><h2 id="k-tot">0</h2></div>
      <div class="card"><small>Win / Loss</small><h2 id="k-wl">0W / 0L</h2></div>
      <div class="card"><small>Accuracy</small><h2 id="k-acc" style="color:#60a5fa">0%</h2></div>
    </div>

    <div class="grid2" style="margin-top:16px">
      <div class="card" style="overflow-x:auto"><h4>Setup-Wise P&L</h4><table><thead><tr><th>Setup</th><th>Trades</th><th>P&L</th></tr></thead><tbody id="b-setup"></tbody></table></div>
      <div class="card" style="overflow-x:auto"><h4>Date-Wise Summary</h4><table><thead><tr><th>Date (Day)</th><th>Trades</th><th>P&L</th></tr></thead><tbody id="b-date"></tbody></table></div>
    </div>

    <div class="card" style="overflow-x:auto">
      <h4>Trade History (<span id="h-mkt">Indian Market</span>)</h4>
      <table><thead><tr><th>Date</th><th>Symbol</th><th>Type</th><th>Setup</th><th>Entry</th><th>Exit</th><th>P&L</th><th>Notes</th><th>Action</th></tr></thead><tbody id="b-list"></tbody></table>
    </div>
  </div>

  <div id="view-entry" class="wrap hidden" style="max-width:650px">
    <div class="card">
      <h3 id="f-title">New Trade Entry</h3>
      <input type="hidden" id="edit-id">
      <div class="grid2">
        <div><label>Market</label><select id="t-mkt" class="inp" onchange="onMkt()"><option>Indian Market</option><option>Bitcoin</option><option>Gold</option></select></div>
        <div><label>Index / Symbol</label><select id="t-sym" class="inp"><option>NIFTY</option><option>SENSEX</option></select></div>
        <div><label>CALL / PUT</label><select id="t-type" class="inp"><option>CALL</option><option>PUT</option></select></div>
        <div><label>Setup Name</label><input type="text" id="t-setup" class="inp" placeholder="GOLDEN / Breakout"></div>
        <div><label>Date</label><input type="date" id="t-date" class="inp"></div>
        <div><label>Entry Time</label><input type="time" id="t-in" class="inp"></div>
        <div><label>Exit Time</label><input type="time" id="t-out" class="inp"></div>
        <div><label>Result</label><select id="t-res" class="inp"><option value="PROFIT">PROFIT (Green)</option><option value="LOSS">LOSS (Red)</option></select></div>
        <div><label>Amount</label><input type="number" step="any" id="t-amt" class="inp" placeholder="2500"></div>
        <div><label>Notes</label><input type="text" id="t-note" class="inp" placeholder="Optional"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button type="button" class="btn blue" style="flex:1" onclick="saveT()">Save Trade</button>
        <button type="button" id="c-edit" class="btn hidden" onclick="resetF()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impob3VvdWN2b3djYmxycG52ZHF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTg4MTAsImV4cCI6MjExMDM5NDgxMH0.H_B6bfsTyKQ60R291YdR9-GQhZVd_XgFMUT4_VCzOX8';
let sess = null, trades = [], mkt = 'Indian Market', mode = 'login';
try { sess = JSON.parse(localStorage.getItem('tjt_s') || 'null'); } catch(e) {}
const $ = id => document.getElementById(id);

window.onload = function() {
  $('t-date').valueAsDate = new Date();
  if (sess && sess.access_token) startApp();
};

function setMode(m) {
  mode = m;
  $('msg').innerText = 'Mode: ' + (m === 'login' ? 'Login' : 'Create Account');
  $('m-login').className = m === 'login' ? 'btn blue' : 'btn';
  $('m-signup').className = m === 'signup' ? 'btn blue' : 'btn';
  $('auth-btn').innerText = m === 'login' ? 'Login to Dashboard' : 'Create Account';
}

async function doAuth() {
  try {
    const email = $('email').value.trim();
    const password = $('pass').value;
    if (!email || password.length < 6) {
      $('msg').innerText = 'Error: Enter valid email & 6+ char password';
      return;
    }
    $('msg').innerText = 'Connecting to Supabase...';
    const ep = mode === 'login' ? '/auth/v1/token?grant_type=password' : '/auth/v1/signup';
    const r = await fetch(SB_URL + ep, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    const d = await r.json();
    if (!r.ok) {
      $('msg').innerText = 'Supabase Error: ' + (d.error_description || d.msg || d.message || JSON.stringify(d));
      return;
    }
    if (d.access_token) {
      sess = d;
      localStorage.setItem('tjt_s', JSON.stringify(d));
      startApp();
    } else {
      $('msg').innerText = 'Account Created! Now click "Login" tab above and sign in.';
    }
  } catch (err) {
    $('msg').innerText = 'Network Error: ' + err.message;
  }
}

function logout() { localStorage.removeItem('tjt_s'); location.reload(); }
function startApp() { $('auth-box').classList.add('hidden'); $('app').classList.remove('hidden'); $('u-mail').innerText = sess.user.email; loadT(); }
function goPage(p) { $('view-dash').classList.toggle('hidden', p !== 'dash'); $('view-entry').classList.toggle('hidden', p !== 'entry'); $('p-dash').className = p === 'dash' ? 'btn blue' : 'btn'; $('p-entry').className = p === 'entry' ? 'btn blue' : 'btn'; if (p === 'dash') render(); }
function setMkt(m) { mkt = m; $('h-mkt').innerText = m; $('t-ind').className = m === 'Indian Market' ? 'btn blue' : 'btn'; $('t-btc').className = m === 'Bitcoin' ? 'btn blue' : 'btn'; $('t-gld').className = m === 'Gold' ? 'btn blue' : 'btn'; render(); }
